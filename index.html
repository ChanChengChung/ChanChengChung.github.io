<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 换成你的头像：把下面这行 favicon 改成你的图片路径即可 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍💻</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============ 基础 SEO（搜索引擎靠这些理解页面）============ -->
    <title>Zeon Chen Zhengzhong | Personal Website</title>
    <meta name="description" content="Zeon Chen Zhengzhong (陳政中) — CUHK Mathematics (AI minor) student, AI developer & co-founder at NovelFlow, researcher (NVIDIA HH-Former, CUHK Reinforcement Learning), quantitative finance enthusiast." />
    <meta name="keywords" content="Zeon Chen Zhengzhong, 陳政中, Chen Zhengzhong, CUHK, Chinese University of Hong Kong, NovelFlow, AI developer, machine learning, reinforcement learning, quantitative finance, NVIDIA HH-Former, personal website" />
    <meta name="author" content="Zeon Chen Zhengzhong" />
    <meta name="theme-color" content="#2a5298" />
    <!-- 把下面这行换成你的真实线上地址（部署后改），帮助搜索引擎定位主域名 -->
    <link rel="canonical" href="https://chenzhengzhong.github.io/" />

    <!-- ============ Open Graph（分享到微信/Telegram/LinkedIn 时的预览卡片）============ -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zeon Chen Zhengzhong | Personal Website" />
    <meta property="og:description" content="CUHK Mathematics (AI) student · AI developer & co-founder at NovelFlow · Researcher (NVIDIA HH-Former, CUHK RL) · Quant enthusiast." />
    <meta property="og:url" content="https://chenzhengzhong.github.io/" />
    <!-- 放一张 1200x630 的预览图到 public/images/og-image.jpg，社交分享才带图 -->
    <meta property="og:image" content="https://chenzhengzhong.github.io/images/og-image.jpg" />

    <!-- ============ Twitter Card ============ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zeon Chen Zhengzhong | Personal Website" />
    <meta name="twitter:description" content="CUHK Mathematics (AI) student · AI developer & co-founder at NovelFlow · Researcher (NVIDIA HH-Former, CUHK RL)." />

    <!-- ============ 结构化数据 JSON-LD（告诉 Google 这是“一个真人”，有助于知识面板）============ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Zeon Chen Zhengzhong",
        "alternateName": "陳政中",
        "jobTitle": "AI Developer & Co-founder at NovelFlow; Research Assistant",
        "description": "CUHK Mathematics (AI minor) student, AI developer, reinforcement learning & quantitative finance researcher.",
        "url": "https://chenzhengzhong.github.io/",
        "image": "https://chenzhengzhong.github.io/images/og-image.jpg",
        "affiliation": [
          { "@type": "Organization", "name": "The Chinese University of Hong Kong" },
          { "@type": "Organization", "name": "NovelFlow" },
          { "@type": "Organization", "name": "NVIDIA" }
        ],
        "sameAs": [
          "https://github.com/chenzhengzhong",
          "https://www.linkedin.com/in/chen-zhengzhong"
        ],
        "email": "mailto:zeon.chen@example.com"
      }
    </script>

    <!-- Font Awesome 图标（导航/社交用），免费 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
